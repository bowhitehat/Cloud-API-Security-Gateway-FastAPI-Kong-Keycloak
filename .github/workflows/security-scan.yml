name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast_and_dependency_scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety

    - name: SAST Scan (Bandit)
      run: |
        echo "Running Bandit to scan for Python security issues..."
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -c .bandit.yml || true

    - name: Dependency Scan (Safety)
      run: |
        echo "Running Safety to check for vulnerable dependencies..."
        safety check -r requirements.txt --full-report || true

  secret_scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  dast_scan:
    runs-on: ubuntu-latest
    needs: [sast_and_dependency_scan]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build and Run Services using Docker Compose
      run: |
        docker compose up -d --build
        echo "Waiting for Kong to expose the API..."
        for attempt in {1..30}; do
          if curl --fail --silent http://localhost:8082/health; then
            echo "API is ready."
            exit 0
          fi
          sleep 2
        done
        echo "API did not become ready in time."
        docker compose logs
        exit 1
        
    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.15.0
      with:
        target: 'http://localhost:8082'
        fail_action: false
        allow_issue_writing: false
        cmd_options: '-a'
