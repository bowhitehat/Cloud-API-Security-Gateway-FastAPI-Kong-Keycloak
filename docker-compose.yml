services:
  db:
    image: postgres:16-alpine
    container_name: capstone_postgres
    environment:
      POSTGRES_DB: capstone_api
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d capstone_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - capstone_net

  api:
    build: .
    container_name: capstone_fastapi
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Cloud API Security Demo"
      SECRET_KEY: "change-this-secret-key-in-real-project"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DATABASE_URL: "postgresql+psycopg2://app:app_password@db:5432/capstone_api"
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/code/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - capstone_net

  kong:
    image: kong:3.6
    container_name: capstone_kong
    depends_on:
      api:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/kong/declarative/kong.yml"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_SSL_CERT: "/certs/localhost.crt"
      KONG_SSL_CERT_KEY: "/certs/localhost.key"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_LOG_LEVEL: "info"
    ports:
      - "8082:8000"   # HTTP qua Kong
      - "8443:8443"   # HTTPS/TLS qua Kong, cert tu ky
      - "8001:8001"   # Kong Admin API local
    volumes:
      - ./gateway/kong.yml:/kong/declarative/kong.yml:ro
      - ./certs:/certs:ro
      - ./logs/kong:/tmp/kong-logs
    networks:
      - capstone_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: capstone_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./idp:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    networks:
      - capstone_net
networks:
  capstone_net:
    driver: bridge

volumes:
  postgres_data:
